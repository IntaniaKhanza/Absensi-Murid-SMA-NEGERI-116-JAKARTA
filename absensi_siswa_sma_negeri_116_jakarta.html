<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Siswa SMA Negeri 116 Jakarta</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js untuk Grafik Dashboard Admin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @media print {
      .no-print {
        display: none !important;
      }

        background: white !important;

</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

  <!-- Container Utama Aplikasi -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Loading Awal -->
    <div class="min-h-screen bg-slate-900 flex flex-col items-center justify-center text-white p-4">
      <svg viewBox="0 0 100 100" class="w-16 h-16 animate-pulse mb-4" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5L90 22V52C90 76 72 91 50 96C28 91 10 76 10 52V22L50 5Z" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
        <path d="M50 14L80 27V51C80 70 66 82 50 86C34 82 20 70 20 51V27L50 14Z" fill="#1E293B"/>
        <circle cx="50" cy="45" r="16" stroke="#38BDF8" stroke-width="3" fill="#0284C7" fill-opacity="0.2"/>
        <path d="M42 45L48 51L59 39" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="74" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="bold" font-family="sans-serif">SMAN 116</text>
      </svg>
      <p class="text-sm text-sky-300 font-medium tracking-wide">Memuat Sistem Absensi SMAN 116 Jakarta...</p>
    </div>
  </div>

  <!-- Container Notifikasi Toast -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-md pointer-events-none"></div>

  <!-- Modal Konfirmasi Kustom -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex items-center gap-3 mb-3">
        <div id="confirm-icon-bg" class="p-2.5 rounded-full bg-rose-100 text-rose-600">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h3 id="confirm-title" class="text-lg font-bold text-slate-900">Konfirmasi</h3>
      </div>
      <p id="confirm-message" class="text-slate-600 text-sm mb-6 leading-relaxed"></p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel-btn" class="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
          Batal
        </button>
        <button id="confirm-ok-btn" class="px-4 py-2 text-sm font-medium text-white bg-rose-600 hover:bg-rose-700 rounded-xl transition">
          Ya, Lanjutkan
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Preview Bukti Foto -->
  <div id="proof-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/75 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <div>
          <h4 id="proof-modal-title" class="font-bold text-sm">Bukti Kehadiran</h4>
          <p id="proof-modal-subtitle" class="text-xs text-sky-300"></p>
        </div>
        <button onclick="window.closeProofModal()" class="p-1 text-slate-300 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 bg-slate-950 flex justify-center">
        <img id="proof-modal-img" src="" alt="Bukti Absensi" class="max-h-[60vh] rounded-xl object-contain" />
      </div>
      <div id="proof-modal-details" class="p-4 bg-slate-50 text-xs space-y-1.5 border-t border-slate-200"></div>
    </div>
  </div>

  <!-- Modal Tambah / Edit Siswa -->
  <div id="student-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 id="student-modal-title" class="text-lg font-bold text-slate-900 mb-4">Tambah Siswa Baru</h3>
      <form id="student-form" onsubmit="window.handleSaveStudent(event)" class="space-y-3.5 text-sm">
        <input type="hidden" id="std-id" />
        <div>
          <label class="block font-semibold text-slate-700 mb-1">NIS *</label>
          <input type="text" id="std-nis" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Nama Lengkap *</label>
          <input type="text" id="std-name" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Kelas</label>
            <select id="std-class" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white"></select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Status Akun</label>
            <select id="std-status" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white">
              <option value="active">Aktif</option>
              <option value="inactive">Nonaktif</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">WA Siswa</label>
            <input type="text" id="std-wa-student" placeholder="0812..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">WA Orang Tua</label>
            <input type="text" id="std-wa-parent" placeholder="0813..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300" />
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Password Login</label>
          <input type="text" id="std-password" required value="password123" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 font-mono" />
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="window.closeStudentModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold">
            Batal
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">
            Simpan Data
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK & Logika Utama Aplikasi -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ============================================================================
    // 1. INISIALISASI FIREBASE CLOUD DATABASE
    // ============================================================================
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : { apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'sman116-absensi-app';

    // ============================================================================
    // 2. STATE GLOBAL APLIKASI
    // ============================================================================
    const state = {
      firebaseUser: null,
      currentUser: null, // { role: 'student' | 'admin', data: {...} }
      loginRole: 'student',
      showPassword: false,
      loginError: '',
      
      // Data Real-time dari Firestore
      students: [],
      classes: [],
      attendances: [],
      waLogs: [],
      settings: {
        schoolName: 'SMA Negeri 116 Jakarta',
        academicYear: '2026/2027',
        semester: 'Ganjil',
        startTime: '06:30',
        lateThreshold: '07:00',
        endTime: '15:00',
        waRecipientMode: 'both'
      },

      // Navigasi Portal
      studentTab: 'dashboard', // 'dashboard' | 'absen' | 'history'
      studentHistoryMonth: 'all',
      
      adminMenu: 'overview', // 'overview' | 'attendance' | 'verification' | 'students' | 'classes' | 'reports' | 'settings'
      sidebarOpen: false,
      
      // Filter Admin
      attSearch: '',
      attFilterClass: 'all',
      attFilterStatus: 'all',
      stdSearch: '',
      reportFilterClass: 'all',

      // Form Absensi Siswa
      absenType: 'Hadir',
      absenNote: '',
      attachmentFile: null,
      capturedPhoto: null,
      captureSessionToken: '',
      locationData: null,
      locationError: '',
      isLocating: false,
      cameraError: '',
      cameraStream: null,
      isSubmittingAbsen: false
    };

    let barChartInstance = null;
    let pieChartInstance = null;

    // ============================================================================
    // 3. HELPER WAKTU WIB & KOMPONEN UI
    // ============================================================================
    function getJakartaTime() {
      const now = new Date();
      const optionsDate = { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' };
      const optionsTime = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      const optionsFullDate = { timeZone: 'Asia/Jakarta', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      
      const parts = new Intl.DateTimeFormat('en-CA', optionsDate).formatToParts(now);
      const year = parts.find(p => p.type === 'year').value;
      const month = parts.find(p => p.type === 'month').value;
      const day = parts.find(p => p.type === 'day').value;
      const dateISO = `${year}-${month}-${day}`;
      
      const timeStr = new Intl.DateTimeFormat('id-ID', optionsTime).format(now).replace(/\./g, ':');
      const fullDateStr = new Intl.DateTimeFormat('id-ID', optionsFullDate).format(now);
      
      return { dateISO, timeStr, fullDateStr, timestamp: now.getTime() };
    }

    // Update elemen jam WIB secara langsung tanpa re-render seluruh DOM
    setInterval(() => {
      const clock = getJakartaTime();
      document.querySelectorAll('.live-wib-time').forEach(el => {
        el.textContent = clock.timeStr + ' WIB';
      });
      document.querySelectorAll('.live-wib-date').forEach(el => {
        el.textContent = clock.fullDateStr;
      });
    }, 1000);

    function getLogoSVG(sizeClass = "w-10 h-10") {
      return `
        <svg viewBox="0 0 100 100" class="${sizeClass} shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 5L90 22V52C90 76 72 91 50 96C28 91 10 76 10 52V22L50 5Z" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
          <path d="M50 14L80 27V51C80 70 66 82 50 86C34 82 20 70 20 51V27L50 14Z" fill="#1E293B"/>
          <circle cx="50" cy="45" r="16" stroke="#38BDF8" stroke-width="3" fill="#0284C7" fill-opacity="0.2"/>
          <path d="M42 45L48 51L59 39" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="50" y="74" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="bold" font-family="sans-serif">SMAN 116</text>
        </svg>
      `;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-slate-900 border-amber-600',
        info: 'bg-sky-600 text-white border-sky-700'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'x-circle',
        warning: 'alert-triangle',
        info: 'info'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${colors[type] || colors.info} transition-all duration-300`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
        <div class="text-sm font-medium flex-1">${message}</div>
        <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100 p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4500);
    }

    function showConfirmModal(title, message, onConfirm, isDanger = true) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      
      const okBtn = document.getElementById('confirm-ok-btn');
      const cancelBtn = document.getElementById('confirm-cancel-btn');
      
      okBtn.className = `px-4 py-2 text-sm font-medium text-white rounded-xl transition ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-slate-900 hover:bg-slate-800'}`;
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const cleanup = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = cleanup;
      okBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
    }

    function getStatusBadge(status) {
      const map = {
        Hadir: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        Sakit: 'bg-rose-100 text-rose-800 border-rose-200',
        Izin: 'bg-amber-100 text-amber-800 border-amber-200',
        Dispen: 'bg-purple-100 text-purple-800 border-purple-200',
      };
      return `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold border ${map[status] || 'bg-slate-100 text-slate-700'}">${status}</span>`;
    }

    function getVerificationBadge(status) {
      if (status === 'Terverifikasi') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-sky-50 text-sky-700 border border-sky-200"><i data-lucide="check-circle-2" class="w-3 h-3"></i> Terverifikasi</span>`;
      }
      if (status === 'Ditolak') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200"><i data-lucide="x-circle" class="w-3 h-3"></i> Ditolak</span>`;
      }
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Perlu Tinjauan</span>`;
    }

    // ============================================================================
    // 4. SINKRONISASI CLOUD DATABASE (FIRESTORE) & SEEDING DATA
    // ============================================================================
    async function initApp() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Auth error:", err);
      }

      onAuthStateChanged(auth, (user) => {
        state.firebaseUser = user;
        if (user) {
          setupFirestoreListeners();
        }
        render();
      });
    }

    function setupFirestoreListeners() {
      const studentsRef = collection(db, 'artifacts', appId, 'public', 'data', 'students');
      const classesRef = collection(db, 'artifacts', appId, 'public', 'data', 'classes');
      const attendancesRef = collection(db, 'artifacts', appId, 'public', 'data', 'attendances');
      const waLogsRef = collection(db, 'artifacts', appId, 'public', 'data', 'wa_logs');
      const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');

      // 1. Kelas
      onSnapshot(classesRef, async (snapshot) => {
        if (snapshot.empty) {
          const initialClasses = [
            { name: 'X-A', waliKelas: 'Dra. Siti Aminah, M.Pd' },
            { name: 'X-B', waliKelas: 'Budi Santoso, S.Pd' },
            { name: 'XI-IPA-1', waliKelas: 'Rina Wijaya, M.Si' },
            { name: 'XI-IPS-1', waliKelas: 'Ahmad Fauzi, S.Pd' },
            { name: 'XII-IPA-1', waliKelas: 'Hendra Kusuma, M.Pd' },
            { name: 'XII-IPS-1', waliKelas: 'Dewi Lestari, S.Sos' }
          ];
          for (const cls of initialClasses) await addDoc(classesRef, cls);
        } else {
          state.classes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.currentUser?.role === 'admin') render();
        }
      }, err => console.error(err));

      // 2. Siswa
      onSnapshot(studentsRef, async (snapshot) => {
        if (snapshot.empty) {
          const initialStudents = [
            { nis: '2026116001', password: 'password123', fullName: 'Ahmad Rizky Pratama', className: 'XII-IPA-1', waStudent: '081234567890', waParent: '081298765432', status: 'active' },
            { nis: '2026116002', password: 'password123', fullName: 'Siti Nurhaliza Putri', className: 'XII-IPA-1', waStudent: '081345678901', waParent: '081398765431', status: 'active' },
            { nis: '2026116003', password: 'password123', fullName: 'Dimas Anggara Putra', className: 'XI-IPA-1', waStudent: '085612345678', waParent: '085687654321', status: 'active' },
            { nis: '2026116004', password: 'password123', fullName: 'Nadia Safira Azzahra', className: 'X-A', waStudent: '087811223344', waParent: '087844332211', status: 'active' },
            { nis: '2026116005', password: 'password123', fullName: 'Muhammad Farhan', className: 'XII-IPS-1', waStudent: '089655443322', waParent: '089622334455', status: 'active' }
          ];
          for (const std of initialStudents) await addDoc(studentsRef, std);
        } else {
          state.students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.currentUser) render();
        }
      }, err => console.error(err));

      // 3. Absensi
      onSnapshot(attendancesRef, (snapshot) => {
        const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        state.attendances = list;
        if (state.currentUser && !(state.currentUser.role === 'student' && state.studentTab === 'absen')) {
          render();
        }
      }, err => console.error(err));

      // 4. Log WhatsApp
      onSnapshot(waLogsRef, (snapshot) => {
        const logs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        logs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        state.waLogs = logs;
        if (state.currentUser?.role === 'admin' && state.adminMenu === 'settings') render();
      }, err => console.error(err));

      // 5. Pengaturan
      onSnapshot(settingsDocRef, async (docSnap) => {
        if (docSnap.exists()) {
          state.settings = { ...state.settings, ...docSnap.data() };
        } else {
          await setDoc(settingsDocRef, state.settings);
        }
      }, err => console.error(err));
    }

    // Pengiriman Notifikasi WhatsApp Otomatis
    async function triggerWhatsAppNotification(attendanceRecord, studentData) {
      const waLogsRef = collection(db, 'artifacts', appId, 'public', 'data', 'wa_logs');
      const messageBody = `ABSENSI BERHASIL\nHalo, ${studentData.fullName}!\nAbsensi Anda berhasil dicatat.\n\nNama: ${studentData.fullName}\nNIS: ${studentData.nis}\nKelas: ${studentData.className}\nTanggal: ${attendanceRecord.dateISO}\nWaktu: ${attendanceRecord.timeStr} WIB\nStatus: ${attendanceRecord.status.toUpperCase()}\n\nTerima kasih telah melakukan absensi.\nAbsensi Siswa SMA Negeri 116 Jakarta.`;

      const recipients = [];
      if (state.settings.waRecipientMode === 'student' || state.settings.waRecipientMode === 'both') {
        if (studentData.waStudent) recipients.push({ role: 'Siswa', number: studentData.waStudent });
      }
      if (state.settings.waRecipientMode === 'parent' || state.settings.waRecipientMode === 'both') {
        if (studentData.waParent) recipients.push({ role: 'Orang Tua/Wali', number: studentData.waParent });
      }

      for (const rec of recipients) {
        await addDoc(waLogsRef, {
          attendanceId: attendanceRecord.id || 'pending',
          studentNis: studentData.nis,
          studentName: studentData.fullName,
          recipientRole: rec.role,
          phoneNumber: rec.number,
          message: messageBody,
          status: 'Terkirim',
          provider: 'WhatsApp Business Cloud API',
          timestamp: Date.now(),
          timeStr: getJakartaTime().timeStr
        });
      }
    }

    // ============================================================================
    // 5. FUNGSI AKSI GLOBAL (WINDOW HANDLERS)
    // ============================================================================
    window.setLoginRole = (role) => {
      state.loginRole = role;
      state.loginError = '';
      render();
    };

    window.togglePasswordVisibility = () => {
      state.showPassword = !state.showPassword;
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      if (input) input.type = state.showPassword ? 'text' : 'password';
      if (icon) {
        icon.setAttribute('data-lucide', state.showPassword ? 'eye-off' : 'eye');
        lucide.createIcons();
      }
    };

    window.fillDemo = (role) => {
      state.loginRole = role;
      state.loginError = '';
      render();
      setTimeout(() => {
        const idInput = document.getElementById('login-identifier');
        const pwInput = document.getElementById('login-password');
        if (role === 'student') {
          if (idInput) idInput.value = '2026116001';
          if (pwInput) pwInput.value = 'password123';
        } else {
          if (idInput) idInput.value = 'admin';
          if (pwInput) pwInput.value = 'admin116';
        }
      }, 20);
    };

    window.handleLogin = (e) => {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value.trim();
      state.loginError = '';

      if (!identifier || !password) {
        state.loginError = 'Harap isi username/NIS dan password Anda.';
        render();
        return;
      }

      if (state.loginRole === 'admin') {
        if ((identifier === 'admin' || identifier === 'guru116') && password === 'admin116') {
          state.currentUser = {
            role: 'admin',
            data: {

    async function initCameraAndGPS() {
      const todayAtt = getTodayStudentAttendance();
      if (todayAtt) return;

      // Kamera WebRTC
      state.cameraError = '';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        state.cameraStream = stream;
        const videoEl = document.getElementById('webcam-video');
        if (videoEl) videoEl.srcObject = stream;
        state.captureSessionToken = `CAM-${Date.now()}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
      } catch (err) {
        state.cameraError = 'Gagal mengakses kamera perangkat. Pastikan izin kamera pada browser telah diaktifkan.';
        render();
      }

      // GPS Geolocation
      window.requestGPSLocation();
    }

    window.requestGPSLocation = () => {
      state.isLocating = true;
      state.locationError = '';
      updateGPSBanner();

      if (!navigator.geolocation) {
        state.locationError = 'Browser Anda tidak mendukung Geolocation GPS.';
        state.isLocating = false;
        updateGPSBanner();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.locationData = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: Math.round(pos.coords.accuracy)
          };
          state.isLocating = false;
          updateGPSBanner();
        },
        (err) => {
          state.locationError = 'Izin lokasi ditolak atau GPS tidak aktif. Lokasi wajib diaktifkan.';
          state.isLocating = false;
          updateGPSBanner();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    };

    window.captureLivePhoto = () => {
      const video = document.getElementById('webcam-video');
      const canvas = document.getElementById('webcam-canvas');
      if (!video || !canvas) return;

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      
      // Mirror efek cermin
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Reset transform & gambar watermark timestamp + identitas
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.fillRect(0, canvas.height - 54, canvas.width, 54);

      const std = getActiveStudent();
      const clock = getJakartaTime();
      ctx.fillStyle = '#38BDF8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`SMAN 116 JAKARTA • ${std.fullName} (${std.nis})`, 12, canvas.height - 34);

      ctx.fillStyle = '#F8FAFC';
      ctx.font = '11px monospace';
      const gpsText = state.locationData ? `GPS: ${state.locationData.lat.toFixed(5)}, ${state.locationData.lng.toFixed(5)} (±${state.locationData.accuracy}m)` : 'GPS: Koordinat dicatat';
      ctx.fillText(`${clock.dateISO} ${clock.timeStr} WIB | ${gpsText}`, 12, canvas.height - 14);

      state.capturedPhoto = canvas.toDataURL('image/jpeg', 0.65);
      stopCamera();
      render();
      updateGPSBanner();
    };

        let addedCount = 0;

        for (let i = 1; i < lines.length; i++) {
          const [nis, fullName, className, waStudent, waParent] = lines[i].split(',').map(s => s?.trim());
          if (nis && fullName && !state.students.some(s => s.nis === nis)) {

              fullName,
              className: className || 'X-A',
              waStudent: waStudent || '',
              waParent: waParent || '',
              password: 'password123',
              status: 'active'
            });
            addedCount++;

      const headers = ['NIS,Nama Lengkap,Kelas,Hadir,Sakit,Izin,Dispen,Total Tercatat,Persentase Hadir (%)'];
      const rows = targetStudents.map(std => {
        const stdAtt = state.attendances.filter(a => a.studentNis === std.nis);
        const hadir = stdAtt.filter(a => a.status === 'Hadir').length;
        const sakit = stdAtt.filter(a => a.status === 'Sakit').length;
        const izin = stdAtt.filter(a => a.status === 'Izin').length;
        const dispen = stdAtt.filter(a => a.status === 'Dispen').length;
        const total = hadir + sakit + izin + dispen;
        const pct = total > 0 ? Math.round((hadir / total) * 100) : 0;
        return `${std.nis},"${std.fullName}",${std.className},${hadir},${sakit},${izin},${dispen},${total},${pct}%`;
      });

      const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");

              <div class="flex items-center gap-3">
                <label class="text-sm font-semibold text-slate-700">Filter Kelas:</label>
                <select onchange="window.updateAttFilter('reportFilterClass', this.value)" class="px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-slate-50">
                  <option value="all">Semua Kelas</option>
                  ${state.classes.map(c => `<option value="${c.name}" ${state.reportFilterClass === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                </select>
              </div>
              <div class="flex gap-2">
                <button onclick="window.exportReportCSV()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="download" class="w-4 h-4"></i> Ekspor Excel (CSV)
                </button>
                <button onclick="window.print()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="file-text" class="w-4 h-4"></i> Cetak Laporan (PDF)
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="p-5 border-b border-slate-100">
                <h3 class="font-bold text-slate-900">Rekapitulasi Persentase Kehadiran Siswa</h3>
                <p class="text-xs text-slate-500">SMA Negeri 116 Jakarta • Dicetak pada ${clock.fullDateStr}</p>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase">
                      <th class="py-3.5 px-4">NIS</th>
                      <th class="py-3.5 px-4">Nama Siswa</th>
                      <th class="py-3.5 px-4">Kelas</th>
                      <th class="py-3.5 px-4 text-center">Hadir</th>
                      <th class="py-3.5 px-4 text-center">Sakit</th>
                      <th class="py-3.5 px-4 text-center">Izin</th>
                      <th class="py-3.5 px-4 text-center">Dispen</th>
                      <th class="py-3.5 px-4 text-right">Persentase</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-sm">
                    ${targetStudents.map(std => {
                      const stdAtt = state.attendances.filter(a => a.studentNis === std.nis);
                      const hadir = stdAtt.filter(a => a.status === 'Hadir').length;
                      const sakit = stdAtt.filter(a => a.status === 'Sakit').length;
                      const izin = stdAtt.filter(a => a.status === 'Izin').length;
                      const dispen = stdAtt.filter(a => a.status === 'Dispen').length;
                      const total = hadir + sakit + izin + dispen;
                      const pct = total > 0 ? Math.round((hadir / total) * 100) : 0;
                      return `
                        <tr class="hover:bg-slate-50">
                          <td class="py-3 px-4 font-mono text-xs">${std.nis}</td>
                          <td class="py-3 px-4 font-semibold text-slate-900">${std.fullName}</td>
                          <td class="py-3 px-4">${std.className}</td>
                          <td class="py-3 px-4 text-center font-bold text-emerald-600">${hadir}</td>
                          <td class="py-3 px-4 text-center font-bold text-rose-600">${sakit}</td>
                          <td class="py-3 px-4 text-center font-bold text-amber-600">${izin}</td>
                          <td class="py-3 px-4 text-center font-bold text-purple-600">${dispen}</td>
                          <td class="py-3 px-4 text-right font-bold text-slate-900">${pct}%</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } else if (state.adminMenu === 'settings') {
        mainContent = `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <form onsubmit="window.handleSaveSettings(event)" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 class="font-bold text-slate-900 text-base border-b border-slate-100 pb-3">Pengaturan Akademik & Jam Absensi</h3>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Tahun Ajaran</label>
                  <input type="text" id="set-academic-year" value="${state.settings.academicYear}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Semester</label>
                  <select id="set-semester" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                    <option value="Ganjil" ${state.settings.semester === 'Ganjil' ? 'selected' : ''}>Ganjil</option>
                    <option value="Genap" ${state.settings.semester === 'Genap' ? 'selected' : ''}>Genap</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Jam Buka Absen</label>
                  <input type="time" id="set-start-time" value="${state.settings.startTime}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Batas Terlambat</label>
                  <input type="time" id="set-late-time" value="${state.settings.lateThreshold}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Jam Tutup</label>
                  <input type="time" id="set-end-time" value="${state.settings.endTime}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
              </div>
              <div class="pt-2">
                <h4 class="font-bold text-slate-900 text-sm mb-2">Konfigurasi WhatsApp Business Cloud API</h4>
                <label class="block text-xs font-bold text-slate-700 mb-1">Target Penerima Notifikasi Otomatis</label>
                <select id="set-wa-mode" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                  <option value="both" ${state.settings.waRecipientMode === 'both' ? 'selected' : ''}>Siswa dan Orang Tua / Wali (Direkomendasikan)</option>
                  <option value="parent" ${state.settings.waRecipientMode === 'parent' ? 'selected' : ''}>Hanya Orang Tua / Wali</option>
                  <option value="student" ${state.settings.waRecipientMode === 'student' ? 'selected' : ''}>Hanya Siswa</option>
                </select>
              </div>
              <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-sm transition">Simpan Pengaturan</button>
            </form>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <div>
                  <h3 class="font-bold text-slate-900 text-base">Log Notifikasi WhatsApp</h3>
                  <p class="text-xs text-slate-500">Riwayat pesan otomatis yang dikirim sistem</p>
                </div>
                <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold border border-emerald-200">API Aktif</span>
              </div>
              <div class="flex-1 overflow-y-auto max-h-80 space-y-3">
                ${state.waLogs.length === 0 ? `<p class="text-center text-slate-400 text-sm py-8">Belum ada log pengiriman WhatsApp.</p>` : state.waLogs.map(log => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
                    <div class="flex justify-between font-bold text-slate-800 mb-1">
                      <span>${log.studentName} (${log.recipientRole})</span>
                      <span class="text-emerald-600">${log.status} • ${log.timeStr}</span>
                    </div>
                    <p class="text-slate-500 font-mono mb-1.5">Tujuan: ${log.phoneNumber}</p>
                    <pre class="whitespace-pre-wrap font-sans text-[11px] text-slate-600 bg-white p-2 rounded border border-slate-200">${log.message}</pre>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="min-h-screen flex bg-slate-100">
          ${state.sidebarOpen ? `<div onclick="window.toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-30 lg:hidden"></div>` : ''}

          <aside class="no-print fixed lg:static inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white flex flex-col transition-transform duration-200 ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
              <div class="flex items-center gap-3">
                ${getLogoSVG('w-9 h-9')}
                <div>
                  <h1 class="font-bold text-sm tracking-tight">SMAN 116 JAKARTA</h1>
                  <span class="text-[11px] text-sky-400 block">Admin & Guru Panel</span>
                </div>
              </div>
              <button onclick="window.toggleSidebar()" class="lg:hidden text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
              ${menus.map(m => `
                <button onclick="window.setAdminMenu('${m.id}')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition ${state.adminMenu === m.id ? 'bg-sky-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                  <div class="flex items-center gap-3"><i data-lucide="${m.icon}" class="w-4 h-4"></i><span>${m.label}</span></div>
                  ${m.id === 'verification' && pendingVerifications > 0 ? `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500 text-slate-950">${pendingVerifications}</span>` : ''}
                </button>
              `).join('')}
            </nav>

            <div class="p-4 border-t border-slate-800">
              <div class="mb-3 px-2">
                <p class="text-xs font-semibold text-white truncate">${admin.fullName}</p>
                <p class="text-[11px] text-slate-400 truncate">${admin.position}</p>
              </div>
              <button onclick="window.handleLogout()" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800 hover:bg-rose-600 text-xs font-semibold text-slate-200 hover:text-white transition">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar Sistem
              </button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="no-print bg-white border-b border-slate-200 h-16 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-20">
              <div class="flex items-center gap-3">
                <button onclick="window.toggleSidebar()" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <h2 class="font-bold text-slate-900 text-base sm:text-lg capitalize">${menus.find(m => m.id === state.adminMenu)?.label}</h2>
              </div>
              <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 text-xs font-medium text-slate-700">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-sky-600"></i>
                <span><span class="live-wib-date">${clock.fullDateStr}</span> • <strong class="font-mono live-wib-time">${clock.timeStr} WIB</strong></span>
              </div>
            </header>

            <main class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto">
              ${mainContent}
            </main>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 8. RENDER GRAFIK DASHBOARD ADMIN (CHART.JS)
    // ============================================================================
    function renderAdminCharts() {
      const clock = getJakartaTime();
      const activeStudents = state.students.filter(s => s.status !== 'inactive');
      const todayList = state.attendances.filter(a => a.dateISO === clock.dateISO);

      const stats = {
        hadir: todayList.filter(a => a.status === 'Hadir').length,
        sakit: todayList.filter(a => a.status === 'Sakit').length,
        izin: todayList.filter(a => a.status === 'Izin').length,
        dispen: todayList.filter(a => a.status === 'Dispen').length,
      };
      const belum = Math.max(0, activeStudents.length - todayList.length);

      // Bar Chart
      const barCanvas = document.getElementById('classBarChart');
      if (barCanvas) {
        if (barChartInstance) barChartInstance.destroy();
        const classMap = {};
        activeStudents.forEach(s => {
          if (!classMap[s.className]) classMap[s.className] = { hadir: 0, tidak: 0 };
          const att = todayList.find(a => a.studentNis === s.nis);
          if (att && att.status === 'Hadir') classMap[s.className].hadir += 1;
          else classMap[s.className].tidak += 1;
        });

        const labels = Object.keys(classMap);
        barChartInstance = new Chart(barCanvas, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Hadir', data: labels.map(k => classMap[k].hadir), backgroundColor: '#10B981', borderRadius: 4 },
              { label: 'Belum/Tidak Hadir', data: labels.map(k => classMap[k].tidak), backgroundColor: '#94A3B8', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }

      // Pie Chart
      const pieCanvas = document.getElementById('statusPieChart');
      if (pieCanvas) {
        if (pieChartInstance) pieChartInstance.destroy();
        pieChartInstance = new Chart(pieCanvas, {
          type: 'doughnut',
          data: {
            labels: ['Hadir', 'Sakit', 'Izin', 'Dispen', 'Belum Absen'],
            datasets: [{
              data: [stats.hadir, stats.sakit, stats.izin, stats.dispen, belum],
              backgroundColor: ['#10B981', '#F43F5E', '#F59E0B', '#8B5CF6', '#94A3B8'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
          }
        });
      }
    }

    // Jalankan Aplikasi
    initApp();
  </script>
</body>
</html>
